# ASP.NET Core
# Build and test ASP.NET Core projects targeting .NET Core.
# Add steps that run tests, create a NuGet package, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/dotnet-core

trigger:
  branches:
    include:
      - main
      - develop
      - feature/*

variables:
  azureContainerRegistryName: 'crvemotueus2'
  azureContainerRegistryUrl: '$(azureContainerRegistryName).azurecr.io'
  dockerComposeFile: 'src/dockerComposeFile.yml'

steps:
- task: DockerCompose@0
  inputs:
    containerregistrytype: 'Azure Container Registry'
    azureSubscription: '$(azureSubscription)'
    azureContainerRegistry: '{"loginServer":"$(azureContainerRegistryUrl)", "id" : "/subscriptions/$(azureSubscriptionUuid)/resourceGroups/$(azureContainerResourceGroup)/providers/Microsoft.ContainerRegistry/registries/$(azureContainerRegistryName)"}'
    dockerComposeFile: '$(dockerComposeFile)'
    action: 'Run a Docker Compose command'
    dockerComposeCommand: 'buildAndPush'
