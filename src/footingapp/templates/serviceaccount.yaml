{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: Service Account
metadata:
  name: {{ include "footingapp.serviceAccountName" . }}
  labels:
    {{- include "footingapp.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
