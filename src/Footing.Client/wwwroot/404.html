<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Footing</title>
    <script>
        // Redirect to index.html preserving the route for Blazor client-side routing.
        // Based on github.com/rafgraph/spa-github-pages
        var l = window.location;
        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1).join('/') + '/?/' +
            l.pathname.slice(1).split('/').slice(0).join('/').replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
    </script>
</head>

<body>
</body>

</html>
