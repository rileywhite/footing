name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Blazor WASM client
        run: dotnet publish src/Footing.Client/Footing.Client.csproj -c Release

      - name: Prepare GitHub Pages output
        run: |
          publish_dir=src/Footing.Client/bin/Release/net10.0/publish/wwwroot

          # Prevent Jekyll processing (_framework would be ignored otherwise)
          touch "$publish_dir/.nojekyll"

          # Custom domain
          echo 'footing.app' > "$publish_dir/CNAME"

          # 404.html for client-side routing — redirects to index.html
          cp src/Footing.Client/wwwroot/404.html "$publish_dir/404.html"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: src/Footing.Client/bin/Release/net10.0/publish/wwwroot

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
