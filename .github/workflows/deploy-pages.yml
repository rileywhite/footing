name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish Blazor WASM client
        run: dotnet publish src/Footing.Client/Footing.Client.csproj -c Release

      - name: Prepare GitHub Pages output
        run: |
          publish_dir=src/Footing.Client/bin/Release/net10.0/publish/wwwroot

          # Checked-in static site shell (landing page, root 404 shim, favicons,
          # robots.txt, sitemap.xml) lands at the site root alongside the Blazor
          # app, which StaticWebAssetBasePath already publishes under app/.
          cp -r src/Footing.Site/. "$publish_dir/"

          # Prevent Jekyll processing (_framework would be ignored otherwise)
          touch "$publish_dir/.nojekyll"

          # Custom domain
          echo 'footing.app' > "$publish_dir/CNAME"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: src/Footing.Client/bin/Release/net10.0/publish/wwwroot
          # Required: v5 excludes dotfiles by default, which would drop the
          # .nojekyll written above and let Jekyll ignore _framework/.
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
